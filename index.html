<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050d18">
<title>WINTICKET SMART FINDER</title>
<style>
:root{
  --bg:#050d18; --bg2:#08111e; --panel:#0b1422; --panel2:#0d1828; --line:#22334b;
  --text:#f8fbff; --muted:#8b9bb0; --blue:#2f96ff; --cyan:#1ed9ff;
  --purple:#7c3cff; --purple2:#5427cb; --green:#25d98d; --gold:#ffc91d; --orange:#ffad28;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:
radial-gradient(900px 480px at 80% 0%,rgba(36,82,170,.15),transparent 60%),
radial-gradient(700px 500px at 0% 15%,rgba(72,31,170,.10),transparent 65%),
linear-gradient(180deg,#050d18 0%,#07111e 100%);color:var(--text)}
main{max-width:1180px;margin:auto;padding:20px 20px 110px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.logoMark{font-size:36px;font-weight:1000;line-height:1;background:linear-gradient(135deg,#7b3cff,#20a6ff);-webkit-background-clip:text;color:transparent;letter-spacing:-.06em}
.brandText{line-height:1}
.brandText b{display:block;font-size:23px;letter-spacing:.04em}
.brandText span{display:block;color:#8da0ba;font-size:11px;margin-top:5px;letter-spacing:.06em}
.online{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:900}
.dot{width:9px;height:9px;border-radius:50%;background:#2fe58f;box-shadow:0 0 12px #2fe58f}
.updated{color:#96a7bb;font-size:11px;margin-top:8px;text-align:right}
.updated b{color:#fff}
.hero{position:relative;overflow:hidden;background:
radial-gradient(340px 180px at 82% 52%,rgba(44,104,255,.28),transparent 68%),
linear-gradient(135deg,#0c1729,#0a1422 55%,#0e1530);border:1px solid #253b59;border-radius:18px;padding:24px;box-shadow:0 15px 60px #0008;margin-bottom:16px}
.hero:after{content:"";position:absolute;right:6%;top:12%;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#1742a4 0%,#0c1d51 38%,transparent 70%);opacity:.28;filter:blur(2px)}
.heroTop{position:relative;z-index:2;display:grid;grid-template-columns:1fr auto;align-items:center;gap:18px}
.heroLabel{font-size:11px;font-weight:950;color:#9eabbe;margin-bottom:10px}
.hero h1{margin:0;font-size:31px;letter-spacing:.01em}
.count{display:flex;align-items:flex-end;gap:9px}
.count b{font-size:78px;line-height:.8;background:linear-gradient(180deg,#33a8ff,#8c47ff);-webkit-background-clip:text;color:transparent}
.count span{font-size:22px;font-weight:900;margin-bottom:7px}
.chips{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{padding:8px 12px;border-radius:999px;border:1px solid #2a405a;background:#0b1624;font-size:11px;font-weight:900;color:#d9e3ef}
.chip.blue{color:#69d5ff;border-color:#2e6684;background:#0c2432}
.chip.gold{color:#ffe37c;border-color:#806516;background:#29220a}
.chip.green{color:#75edb5;border-color:#227355;background:#0c2b21}

.progressCard{background:linear-gradient(180deg,#0a1422,#08111d);border:1px solid #24364e;border-left:4px solid #7844ff;border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:0 10px 34px #0004}
.progressHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
.progressHead h2{font-size:17px;margin:0}
.autoBadge{font-size:11px;color:#6df0ba;border:1px solid #17684b;background:#0b2a20;border-radius:999px;padding:6px 10px;font-weight:900}
.steps{display:grid;grid-template-columns:repeat(4,1fr);align-items:start;position:relative;gap:8px}
.steps:before{content:"";position:absolute;left:12.5%;right:12.5%;top:20px;height:3px;background:#1c2938;z-index:0}
.step{position:relative;z-index:1;text-align:center}
.circle{width:42px;height:42px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;border:3px solid #23354b;background:#0a1420;font-weight:950;font-size:17px}
.step.done .circle{border-color:#1fc8ff;background:#0c4052;box-shadow:0 0 20px #1fc8ff55}
.step.active .circle{border-color:#8248ff;background:#26134b;box-shadow:0 0 20px #8248ff77}
.step b{display:block;font-size:11px}
.step span{display:block;font-size:9px;color:#71869d;margin-top:3px}
.progressMeta{margin-top:14px;color:#8799ae;font-size:11px}
.progressMeta b{color:#dce7f3}

.sectionHead{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.sectionHead h2{margin:0;font-size:20px}
.sectionHead span{color:#8294aa;font-size:11px}
.venueNav{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px}
.venueBtn{white-space:nowrap;border:1px solid #314b68;background:#0d1c2c;color:white;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:900;text-decoration:none}
.venueBtn b{color:#7fb6ff;margin-left:4px}

.race{display:grid;grid-template-columns:130px minmax(0,1fr) 360px;gap:18px;background:linear-gradient(180deg,#0c1726,#0a1320);border:1px solid #263a53;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 12px 32px #0004}
.leftCol{border-right:1px solid #203148;padding-right:14px}
.grade{display:inline-block;background:#1456c9;color:white;border-radius:5px;padding:4px 10px;font-size:12px;font-weight:950}
.raceNo{font-size:26px;font-weight:950;margin-top:10px}
.startTime{font-size:25px;font-weight:950;margin-top:3px}
.session{font-size:12px;color:#ffc830;margin-top:8px;font-weight:950}
.venue{font-size:18px;font-weight:950;margin-top:10px}
.midCol{padding-top:3px}
.ai{display:inline-block;background:#28105a;color:#d9c4ff;border:1px solid #6636b4;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:950}
.info{margin-top:10px;font-size:14px;color:#aebdd0;line-height:1.7}
.info b{color:#fff}
.order{margin-top:8px;font-size:12px;color:#8fa3ba}
.betCol{display:flex;flex-direction:column;justify-content:center}
.betTitle{color:#ffd429;font-weight:950;font-size:13px;margin-bottom:7px}
.betBox{border:1px solid #d8a900;background:#10172a;border-radius:10px;padding:12px;text-align:center;box-shadow:inset 0 0 0 1px #4a3c08}
.betBox b{display:block;font-size:21px}
.betBox small{display:block;color:#b9c4d3;margin-top:7px;font-size:10px}
.vote{display:block;margin-top:10px;text-align:center;text-decoration:none;color:white;background:linear-gradient(90deg,#7737ed,#5827c9);padding:12px;border-radius:9px;font-size:13px;font-weight:950;box-shadow:0 8px 24px #6b37da55}
.empty{border:1px dashed #28405b;background:#08131f;border-radius:14px;padding:34px 15px;text-align:center;color:#8194aa}

.f2Row{display:flex;gap:7px;overflow:auto;padding:4px 0 2px;margin-bottom:12px}
.f2pill{white-space:nowrap;border:1px solid #304b68;background:#0d1c2a;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}
.f2pill .g{color:#5eedab}.f2pill .s{color:#ffd059;margin-left:5px}

.bottomNav{position:fixed;left:0;right:0;bottom:0;background:rgba(5,12,20,.95);backdrop-filter:blur(16px);border-top:1px solid #1d2d40;z-index:50}
.navIn{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.navItem{border:0;background:transparent;color:#8fa1b7;border-radius:10px;padding:9px 6px;font-size:10px;font-weight:900}
.navItem.active{background:linear-gradient(180deg,#281550,#15112c);color:#d7c6ff;border:1px solid #463080}
.navIcon{font-size:18px;display:block;margin-bottom:3px}
.navAction{background:linear-gradient(90deg,#2d89f5,#24a6ff);color:white!important}
.hidden{display:none!important}
.error{background:#35151c;color:#ffc0c8;border-radius:10px;padding:9px;margin-top:7px;font-size:11px}

@media(max-width:760px){
  main{padding:14px 11px 105px}
  .brandText b{font-size:18px}.logoMark{font-size:29px}
  .hero{padding:18px}
  .heroTop{grid-template-columns:1fr}
  .count{justify-content:flex-start}.count b{font-size:62px}
  .steps{gap:2px}.circle{width:36px;height:36px;font-size:14px}
  .race{grid-template-columns:88px 1fr;gap:12px}
  .betCol{grid-column:1 / -1}
  .leftCol{padding-right:10px}
  .raceNo{font-size:21px}.startTime{font-size:19px}
  .venue{font-size:15px}
}
</style>
</head>
<body>
<main>
  <div class="top">
    <div class="brand">
      <div class="logoMark">W</div>
      <div class="brandText"><b>WINTICKET<br>SMART FINDER</b><span>SIMPLE ENGINE COMPLETE AUTO</span></div>
    </div>
    <div>
      <div class="online"><span class="dot"></span><span id="pcState">オンライン</span></div>
      <div class="updated">最終更新 <b id="updated">未検索</b></div>
    </div>
  </div>

  <section class="hero">
    <div class="heroTop">
      <div>
        <div class="heroLabel">本日の該当件数</div>
        <h1>本日の買えるレース</h1>
      </div>
      <div class="count"><b id="matchCount">0</b><span>件</span></div>
    </div>
    <div class="chips">
      <span class="chip blue">F2のみ</span>
      <span class="chip gold">AI予想 ★2</span>
      <span class="chip">ライン 3.2.2 / 2.3.2 / 2.2.3</span>
      <span class="chip green">4.3 追加条件</span>
      <span class="chip">ガールズ除外</span>
    </div>
  </section>

  <section class="progressCard">
    <div class="progressHead">
      <h2>検索状況</h2>
      <span class="autoBadge">● 自動更新ON</span>
    </div>
    <div class="steps">
      <div class="step" id="step1"><div class="circle">1</div><b>開催場取得</b><span id="step1time">—</span></div>
      <div class="step" id="step2"><div class="circle">2</div><b>F2自動選択</b><span id="step2time">—</span></div>
      <div class="step" id="step3"><div class="circle">3</div><b>データ検索</b><span id="step3time">—</span></div>
      <div class="step" id="step4"><div class="circle">4</div><b>完了</b><span id="step4time">—</span></div>
    </div>
    <div class="progressMeta">状態：<b id="status">待機中</b>　／　現在：<b id="current">—</b></div>
    <div id="detail" class="progressMeta"></div>
  </section>

  <div class="sectionHead"><h2>今日のF2開催</h2><span>自動選択</span></div>
  <div id="f2Row" class="f2Row"><span class="f2pill">開催場取得待ち</span></div>

  <div class="sectionHead"><h2>該当レース一覧</h2><span id="resultHint">未検索</span></div>
  <div id="venueNav" class="venueNav"></div>
  <div id="results"><div class="empty">まだ検索していません。</div></div>
  <div id="errors"></div>
</main>

<div class="bottomNav">
  <div class="navIn">
    <button class="navItem active"><span class="navIcon">⌂</span>ホーム</button>
    <button class="navItem"><span class="navIcon">≡</span>条件設定</button>
    <button id="startBtn" class="navItem navAction"><span class="navIcon">↻</span>今日を検索</button>
    <button id="retryBtn" class="navItem hidden"><span class="navIcon">◷</span>再検索</button>
    <button id="stopBtn" class="navItem hidden"><span class="navIcon">■</span>途中停止</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const CONTROL_KEY=localStorage.getItem("wt_control_key")||"";
const headers={"Content-Type":"application/json",...(CONTROL_KEY?{"X-Control-Key":CONTROL_KEY}:{})};
let busyAuto=false,lastState=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(ts){if(!ts)return "未検索";return new Date(ts*1000).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}
function post(url,body){return fetch(url,{method:"POST",headers,body:body?JSON.stringify(body):null}).then(async r=>{let d={};try{d=await r.json()}catch(e){}return{http:r.status,...d}})}
function phaseName(s){
 if(!s.running){
   if(s.phase==="done")return "検索完了";
   if(s.phase==="stopped")return "途中停止";
   if(s.phase==="error")return "エラー";
   if(s.phase==="select")return "F2選択完了";
   return "待機中";
 }
 return ({queued:"PC応答待ち",board:"開催場取得中",races:"データ検索中",stopping:"停止中"})[s.phase]||"検索中";
}
function setSteps(s){
 [1,2,3,4].forEach(i=>$("step"+i).className="step");
 if(s.phase==="board"||s.phase==="queued"){ $("step1").classList.add("active"); return; }
 if(s.phase==="select"){ $("step1").classList.add("done"); $("step2").classList.add("active"); return; }
 if(s.phase==="races"||s.running){ $("step1").classList.add("done"); $("step2").classList.add("done"); $("step3").classList.add("active"); return; }
 if(s.phase==="done"){ [1,2,3,4].forEach(i=>$("step"+i).classList.add("done")); return; }
}
function renderF2(rows){
 const f2=(rows||[]).filter(v=>v.grade==="F2");
 $("f2Row").innerHTML=f2.length?f2.map(v=>`<span class="f2pill">${esc(v.venue)}<span class="g"> F2</span><span class="s">${esc(v.session||"?")}</span></span>`).join(""):'<span class="f2pill">F2開催なし</span>';
}
function renderMatches(rows){
 $("matchCount").textContent=rows.length;
 if(!rows.length){
   $("venueNav").innerHTML="";
   $("results").innerHTML='<div class="empty">現在の該当レースなし</div>';
   return;
 }
 const counts={}; rows.forEach(r=>counts[r.venue]=(counts[r.venue]||0)+1);
 $("venueNav").innerHTML=Object.entries(counts).map(([v,n])=>`<a class="venueBtn" href="#v-${encodeURIComponent(v)}">${esc(v)}<b>${n}件</b></a>`).join("");
 const seen={};
 $("results").innerHTML=rows.map(r=>{
   const anchor=!seen[r.venue]?(seen[r.venue]=true,` id="v-${encodeURIComponent(r.venue)}"`):"";
   const url=r.event_url||r.winticket_url||r.prediction_url||"#";
   const bet=r.bet||"既存条件";
   return `<article class="race"${anchor}>
     <div class="leftCol">
       <span class="grade">${esc(r.grade||"F2")}</span>
       <div class="raceNo">${esc(r.race)}R</div>
       <div class="startTime">${esc(r.start_time||"")}</div>
       <div class="session">${esc(r.session||"")}</div>
       <div class="venue">${esc(r.venue)}</div>
     </div>
     <div class="midCol">
       <span class="ai">AI予想 ★2</span>
       <div class="info">ライン：<b>${esc(r.line||"")}</b><br>印：<b>${esc(r.three_order||"")}</b></div>
       <div class="order">並び：${esc(r.order||"—")}</div>
       <div class="order">${esc(r.condition_name||"")}</div>
     </div>
     <div class="betCol">
       <div class="betTitle">買い目</div>
       <div class="betBox"><b>${esc(bet)}</b><small>${esc(r.condition_name||"")}</small></div>
       <a class="vote" href="${esc(url)}" target="_blank" rel="noopener">WINTICKETで投票</a>
     </div>
   </article>`;
 }).join("");
}
async function update(){
 try{
   const s=await (await fetch("/api/status",{cache:"no-store"})).json(); lastState=s;
   const matches=s.matches||[], errors=s.errors||[];
   $("pcState").textContent=s.agent_online?"オンライン":"PC未接続";
   $("updated").textContent=fmt(s.updated_at||s.finished_at||0);
   $("status").textContent=phaseName(s);
   $("current").textContent=s.current||"—";
   $("detail").textContent=s.detail||"";
   $("resultHint").textContent=s.phase==="done"?`${matches.length}件`:(s.running?"検索中":"未検索");
   setSteps(s); renderF2(s.venues_info||[]); renderMatches(matches);
   $("errors").innerHTML=errors.map(e=>`<div class="error">${esc(e)}</div>`).join("");
   $("startBtn").disabled=!!s.running||!s.agent_online;
   $("retryBtn").classList.toggle("hidden",s.running||!s.agent_online||!["done","stopped"].includes(s.phase));
   $("stopBtn").classList.toggle("hidden",!s.running);
 }catch(e){$("pcState").textContent="通信エラー"}
}
async function startAll(){
 if(busyAuto)return; busyAuto=true;
 try{
   let d=await post("/api/control/load-board",{});
   if(!d.ok){alert("開催場取得を開始できません: "+(d.reason||d.http));return}
   const deadline=Date.now()+180000;
   while(Date.now()<deadline){
     await new Promise(r=>setTimeout(r,1500));
     const st=await (await fetch("/api/status",{cache:"no-store"})).json();
     if(!st.running && (st.venues_info||[]).length){
       d=await post("/api/control/auto-search",{});
       if(!d.ok)alert("F2自動検索を開始できません: "+(d.reason||d.http));
       return;
     }
     if(st.phase==="error"){alert("開催場取得でエラーが発生しました");return}
   }
   alert("開催場取得がタイムアウトしました");
 }finally{busyAuto=false}
}
$("startBtn").onclick=startAll;
$("retryBtn").onclick=async()=>{const d=await post("/api/control/auto-search",{});if(!d.ok)alert("再検索できません: "+(d.reason||d.http))};
$("stopBtn").onclick=async()=>{await post("/api/control/stop",{})};
setInterval(update,1500); update();
</script>
</body>
</html>
