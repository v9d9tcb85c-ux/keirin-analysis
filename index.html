<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f"><title>WINTICKET PCリモート</title>
<style>
:root{color-scheme:dark;--bg:#06101d;--panel:#0d1b2e;--panel2:#0a1626;--line:#294767;--blue:#3b82f6;--green:#6ee7a0;--red:#ff9fa8;--muted:#9db0c8;--amber:#ffd166}
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#fff;margin:0;padding:14px 14px 110px;max-width:900px;margin-inline:auto}
h1{font-size:27px;margin:5px 0 2px}.sub{color:var(--muted);font-size:14px;margin:0 0 12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.title{font-size:19px;font-weight:900;margin-bottom:10px}
.online{color:var(--green)}.offline{color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.venue{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:12px;min-height:92px;position:relative}.venue:has(input:checked){outline:2px solid var(--blue);background:#102543}.venue input{position:absolute;right:10px;top:10px;width:26px;height:26px;accent-color:var(--blue)}.venue.disabled{opacity:.48}.name{font-size:19px;font-weight:900;padding-right:30px}.tags{margin-top:10px;display:flex;gap:6px}.tag{border:1px solid #44688f;border-radius:9px;padding:5px 8px;font-weight:900;font-size:14px}.f2{color:var(--green);border-color:#387953}.f1{color:var(--red);border-color:#75444d}.unknown{color:var(--amber)}
.current{font-size:18px;font-weight:900}.detail{color:var(--muted);font-size:13px;line-height:1.5;margin-top:5px}.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.metric{background:var(--panel2);border:1px solid var(--line);padding:8px 10px;border-radius:11px;font-size:13px}.metric b{font-size:18px}
.track{height:12px;background:#071321;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:12px}.fill{height:100%;width:0;background:var(--blue);transition:width .4s}.result{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.go{display:block;text-align:center;text-decoration:none;background:var(--blue);color:#fff;border-radius:11px;padding:10px;font-weight:900;margin-top:8px}.empty{color:var(--muted)}.error{color:#ffc0c5;font-size:13px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(5,12,22,.97);border-top:1px solid #203650;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:20}.bottomin{display:flex;gap:8px;width:min(900px,100%);margin:auto}.bottom button{flex:1;border:0;border-radius:13px;padding:14px 8px;color:#fff;background:var(--blue);font-weight:900;font-size:15px}.bottom .stop{background:#963d45}.bottom .secondary{background:#29415c}.hide{display:none!important}
@media(max-width:420px){body{padding-inline:10px}.grid{gap:7px}.venue{padding:10px;min-height:88px}.name{font-size:17px}}
</style></head><body>
<h1>WINTICKET F2巡回</h1><p class="sub">スマホは操作・表示だけ。WINTICKET取得はPCで実行します。</p>

<section class="card">
  <div class="title">PC接続</div>
  <div id="pc" class="offline">● PC未接続</div>
  <div id="pcDetail" class="detail">PC側の agent を起動してください。</div>
</section>

<section class="card">
  <div class="title">① 今日の開催場</div>
  <div id="board" class="grid"><div class="empty">PC接続後に「今日の開催場を取得」を押してください。</div></div>
  <div id="selected" class="detail">選択中 0場</div>
  <div class="detail">F2だけチェックできます。M=モーニング / D=デイ / N=ナイター / MN=ミッドナイト</div>
</section>

<section class="card">
  <div class="title">進行状況</div>
  <div id="status" class="current">待機中</div>
  <div id="current" class="detail">現在：—</div>
  <div id="detail" class="detail"></div>
  <div class="track"><div id="fill" class="fill"></div></div>
  <div class="metrics">
    <div class="metric">確認 <b id="checked">0</b>R</div>
    <div class="metric">星2 <b id="star">0</b>R</div>
    <div class="metric">該当 <b id="match">0</b>R</div>
  </div>
</section>

<section class="card">
  <div class="title">② 該当レース</div>
  <div id="results"><div class="empty">まだ検索していません。</div></div>
  <div id="errors" class="error"></div>
</section>

<div class="bottom"><div class="bottomin">
  <button id="load">今日の開催場を取得</button>
  <button id="search" class="hide">チェックした場を検索</button>
  <button id="stop" class="stop hide">途中停止</button>
  <button id="reset" class="secondary hide">終了</button>
</div></div>

<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
let boardKey="",selectedSlugs=new Set();
const CONTROL_KEY=localStorage.getItem("wt_control_key")||"";
const headers={"Content-Type":"application/json",...(CONTROL_KEY?{"X-Control-Key":CONTROL_KEY}:{})};

function selected(){return [...document.querySelectorAll(".venueCheck:checked")].map(x=>x.value)}
function updateSelected(){selectedSlugs=new Set(selected());$("selected").textContent=`選択中 ${selectedSlugs.size}場`}
function renderBoard(items){
  const key=JSON.stringify(items); if(key===boardKey)return; boardKey=key;
  if(!items.length){$("board").innerHTML='<div class="empty">開催場をまだ取得していません。</div>';return}
  $("board").innerHTML=items.map(v=>{
    const grade=v.grade||"?", selectable=grade==="F2", cls=grade==="F2"?"f2":grade==="F1"?"f1":"unknown";
    const checked=selectedSlugs.has(v.slug)&&selectable?"checked":"";
    return `<label class="venue ${selectable?"":"disabled"}"><input class="venueCheck" type="checkbox" value="${esc(v.slug)}" ${checked} ${selectable?"":"disabled"}><div class="name">${esc(v.venue)}</div><div class="tags"><span class="tag ${cls}">${esc(grade)}</span><span class="tag">${esc(v.session||"?")}</span></div></label>`
  }).join("");
  document.querySelectorAll(".venueCheck").forEach(e=>e.onchange=updateSelected); updateSelected();
}
function renderResults(rows){
  $("results").innerHTML=rows.length?rows.map(r=>`<div class="result"><b>${esc(r.venue)} ${esc(r.race)}R</b><div class="detail">${esc(r.star||"")} / ${esc(r.line||"")} / ${esc(r.three_order||"")}</div><a class="go" target="_blank" rel="noopener" href="${esc(r.winticket_url||r.prediction_url||"#")}">WINTICKETで見る</a></div>`).join(""):'<div class="empty">現在の該当レースなし</div>';
}
function pct(s,c){
  if(s.phase==="select"||s.phase==="done")return 100;
  const total=Number(c.selected_venues||c.board_total||0), done=Number(c.venue_index||c.board_done||0);
  if(total>0)return Math.max(3,Math.min(99,Math.round(done/total*100)));
  return s.running?12:0;
}
async function post(url,body){const r=await fetch(url,{method:"POST",headers,body:body?JSON.stringify(body):null});let d={};try{d=await r.json()}catch(e){}return{http:r.status,...d}}
async function update(){
  try{
    const s=await(await fetch("/api/status",{cache:"no-store"})).json(),c=s.counters||{};
    $("pc").textContent=s.agent_online?"● PC接続中":"● PC未接続"; $("pc").className=s.agent_online?"online":"offline";
    $("pcDetail").textContent=s.agent_online?"取得処理はPC側で実行されます。":"PC側の agent を起動してください。";
    $("status").textContent=({idle:"待機中",queued:"PC応答待ち",board:"開催場取得中",select:"開催場を選択",races:"検索中",done:"検索完了",stopped:"途中停止",error:"エラー"})[s.phase]||s.phase;
    $("current").textContent="現在："+(s.current||"—"); $("detail").textContent=s.detail||"";
    $("checked").textContent=c.checked_races||0; $("star").textContent=c.star2||0; $("match").textContent=(s.matches||[]).length;
    $("fill").style.width=pct(s,c)+"%";
    renderBoard(s.venues_info||[]); renderResults(s.matches||[]);
    $("errors").innerHTML=(s.errors||[]).map(e=>`<div>${esc(e)}</div>`).join("");
    $("load").classList.toggle("hide",s.running||s.phase!=="idle"||!s.agent_online);
    $("search").classList.toggle("hide",s.running||s.phase!=="select"||!s.agent_online);
    $("stop").classList.toggle("hide",!s.running);
    $("reset").classList.toggle("hide",s.running||!["select","done","stopped","error"].includes(s.phase));
  }catch(e){$("pc").textContent="● Render通信エラー";$("pc").className="offline"}
}
$("load").onclick=async()=>{const d=await post("/api/control/load-board");if(!d.ok)alert(d.reason||"開始できません");update()};
$("search").onclick=async()=>{const a=selected();if(!a.length)return alert("F2開催場をチェックしてください");const d=await post("/api/control/search",{selected:a});if(!d.ok)alert(d.reason||"検索開始できません");update()};
$("stop").onclick=async()=>{await post("/api/control/stop");update()};
$("reset").onclick=async()=>{
  const d=await post("/api/control/reset");
  if(d.ok){
    boardKey="";
    selectedSlugs.clear();
    renderBoard([]);
    renderResults([]);
    $("selected").textContent="選択中 0場";
    $("checked").textContent="0";
    $("star").textContent="0";
    $("match").textContent="0";
    $("fill").style.width="0%";
  }
  update();
};
update();setInterval(update,1200);
</script></body></html>
