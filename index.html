<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<title>WINTICKET SMART FINDER</title>
<style>
:root{
  --bg:#07111d;--panel:#0b1725;--panel2:#0d1d2d;--line:#223a52;
  --text:#f4f8ff;--muted:#8195ad;--blue:#2d8cff;--cyan:#16d7ff;
  --purple:#8d4cff;--purple2:#6937d6;--green:#2de6a1;--gold:#ffcf4b;
  --red:#ff5d73;--orange:#ff9c52;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:
radial-gradient(circle at 10% 0%,#0a2a45 0%,transparent 35%),
linear-gradient(180deg,#06101a 0%,#09131f 100%);color:var(--text)}
main{max-width:1180px;margin:auto;padding:24px 20px 130px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:18px}
.brandRow{display:flex;align-items:center;gap:12px}
.logo{font-size:21px;font-weight:950;letter-spacing:.04em}
.badge{font-size:11px;border:1px solid #245a78;color:#6fdcff;background:#0b2231;padding:5px 9px;border-radius:999px;font-weight:900}
.topMeta{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.meta{background:#0a1723;border:1px solid #24394e;border-radius:10px;padding:8px 11px;font-size:12px;color:#a9bdd2}
.meta b{color:white}
.hero{
background:linear-gradient(135deg,#10253e 0%,#0d1d31 65%,#131932 100%);
border:1px solid #26445f;border-radius:18px;padding:20px 22px;box-shadow:0 14px 50px #0007;
}
.heroGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:center}
.eyebrow{font-size:11px;color:#5fd8ff;font-weight:900;letter-spacing:.12em}
h1{font-size:34px;margin:8px 0 6px}
.subtitle{font-size:13px;color:#95aac0;line-height:1.55}
.bigStat{display:flex;align-items:flex-end;justify-content:flex-end;gap:8px}
.bigStat b{font-size:58px;line-height:.85}
.bigStat span{font-size:17px;color:#aab9ca;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.chip{font-size:11px;font-weight:900;border-radius:999px;padding:7px 10px;border:1px solid #2a4259;background:#0b1825;color:#c8d7e7}
.chip.blue{color:#6cd9ff;border-color:#245f7a;background:#0c2635}
.chip.gold{color:#ffe37a;border-color:#7b6523;background:#29230c}
.chip.green{color:#76f2b9;border-color:#21664b;background:#0e2d23}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px;margin-top:18px}
.side{display:flex;flex-direction:column;gap:14px}
.card{background:linear-gradient(180deg,#0c1825,#09131f);border:1px solid #21384f;border-radius:16px;padding:16px;box-shadow:0 10px 30px #0004}
.cardTitle{font-size:13px;font-weight:950;margin-bottom:12px;color:#dce8f4}
.progressRow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.step{background:#08131e;border:1px solid #1e3448;border-radius:10px;padding:10px;text-align:center}
.step.active{border-color:#236cc9;background:#0c2440}
.step b{display:block;font-size:16px}
.step span{font-size:9px;color:#7e94aa}
.bar{height:7px;border-radius:999px;background:#08111b;overflow:hidden;margin-top:12px}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:.3s}
.statusLine{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:#8da3b9}
.statusLine b{color:white}
.f2List{display:flex;flex-wrap:wrap;gap:6px}
.f2pill{padding:7px 9px;border-radius:8px;background:#0d1b29;border:1px solid #25435c;font-size:11px;font-weight:900}
.f2pill .g{color:#65e7aa}.f2pill .s{color:#ffd461;margin-left:5px}
.resultsHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.resultsHeader h2{margin:0;font-size:18px}
.venueNav{display:flex;gap:6px;overflow:auto;padding:4px 0 10px}
.venueBtn{white-space:nowrap;text-decoration:none;color:#cde0f3;background:#0e2031;border:1px solid #2b4c69;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}
.race{background:linear-gradient(180deg,#0e2031,#0b1724);border:1px solid #2b4760;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 10px 28px #0003}
.raceTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.venue{font-size:20px;font-weight:950}
.raceNo{font-size:12px;color:#86a6c4;margin-top:2px;font-weight:900}
.session{font-size:13px;color:#67c8ff;font-weight:900}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{background:#08141f;border:1px solid #29445d;border-radius:8px;padding:6px 8px;font-size:10px;font-weight:900}
.tag.star{color:#ffe16d;border-color:#715d1f;background:#251f0b}
.tag.hit{color:#72efb2;border-color:#23684d;background:#0c2b20}
.order{margin-top:10px;background:#08131f;border:1px solid #192f42;border-radius:10px;padding:10px;font-size:12px;line-height:1.55;color:#d5e1ed}
.bet{margin-top:10px;background:linear-gradient(135deg,#1a1d38,#15162a);border:1px solid #40376f;border-radius:11px;padding:11px}
.bet small{display:block;color:#a7a5c8;font-weight:800}
.bet b{display:block;font-size:18px;margin-top:3px}
.cond{font-size:10px;color:#9daac0;margin-top:5px}
.vote{display:block;margin-top:11px;text-align:center;text-decoration:none;color:white;font-weight:950;background:linear-gradient(90deg,var(--purple),var(--purple2));border-radius:10px;padding:12px;box-shadow:0 8px 22px #6f43d844}
.empty{border:1px dashed #2b445b;border-radius:14px;padding:28px;text-align:center;color:#7f95aa;background:#091522}
.error{background:#35151c;border:1px solid #63303a;color:#ffc0c8;border-radius:10px;padding:10px;margin-top:7px;font-size:11px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(5,12,20,.94);backdrop-filter:blur(16px);border-top:1px solid #1f3346;padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:50}
.bottomIn{max-width:1180px;margin:auto;display:flex;gap:8px}
button{border:0;border-radius:11px;padding:13px 16px;font-weight:950;color:#fff;font-size:14px}
.primary{background:linear-gradient(90deg,#1e7fe8,#24a6ff);flex:1}
.secondary{background:#22364a;flex:1}
.stop{background:#82303a;flex:1}
.hidden{display:none!important}
@media(max-width:820px){
 main{padding:16px 12px 120px}
 .topbar{align-items:flex-start}
 .heroGrid{grid-template-columns:1fr}
 .bigStat{justify-content:flex-start;margin-top:8px}
 .grid{grid-template-columns:1fr}
 h1{font-size:28px}
 .bigStat b{font-size:48px}
}
</style>
</head>
<body>
<main>
  <div class="topbar">
    <div class="brandRow">
      <div class="logo">WINTICKET SMART FINDER</div>
      <div class="badge">ONLINE</div>
    </div>
    <div class="topMeta">
      <div class="meta">最終更新 <b id="updated">未検索</b></div>
      <div class="meta">PC <b id="pcState">未接続</b></div>
    </div>
  </div>

  <section class="hero">
    <div class="heroGrid">
      <div>
        <div class="eyebrow">COMPLETE AUTO FINDER</div>
        <h1>本日の買えるレース</h1>
        <div class="subtitle">今日の開催場を取得 → F2を自動選択 → AI予想・ライン・印条件を自動判定 → 買い目を表示します。</div>
        <div class="chips">
          <span class="chip blue">F2 自動選択</span>
          <span class="chip gold">AI予想 ★★☆ 星2</span>
          <span class="chip">3.2.2</span>
          <span class="chip">2.3.2</span>
          <span class="chip">2.2.3</span>
          <span class="chip green">4.3</span>
          <span class="chip">ガールズ除外</span>
        </div>
      </div>
      <div class="bigStat"><b id="matchCount">0</b><span>件</span></div>
    </div>
  </section>

  <div class="grid">
    <aside class="side">
      <section class="card">
        <div class="cardTitle">自動検索ステータス</div>
        <div class="progressRow">
          <div class="step"><b>1</b><span>開催場取得</span></div>
          <div class="step"><b>2</b><span>F2自動選択</span></div>
          <div class="step"><b>3</b><span>データ検索</span></div>
          <div class="step"><b>4</b><span>完了</span></div>
        </div>
        <div class="bar"><div id="fill" class="fill"></div></div>
        <div class="statusLine" style="margin-top:10px"><span>状態</span><b id="status">待機中</b></div>
        <div class="statusLine" style="margin-top:6px"><span>現在</span><b id="current">—</b></div>
        <div id="detail" style="margin-top:9px;font-size:11px;color:#8199b1;line-height:1.5"></div>
      </section>

      <section class="card">
        <div class="cardTitle">今日のF2開催</div>
        <div id="f2List" class="f2List"><span style="color:#71869b;font-size:11px">開催場取得待ち</span></div>
      </section>

      <section class="card">
        <div class="cardTitle">絞り込み状況</div>
        <div class="statusLine"><span>確認レース</span><b id="checked">0</b></div>
        <div class="statusLine"><span>星2</span><b id="star">0</b></div>
        <div class="statusLine"><span>指定ライン</span><b id="lineCount">0</b></div>
        <div class="statusLine"><span>印条件</span><b id="orderCount">0</b></div>
      </section>
    </aside>

    <section class="card">
      <div class="resultsHeader">
        <h2>検索ヒット</h2>
        <span id="resultHint" style="font-size:11px;color:#8095ab">未検索</span>
      </div>
      <div id="venueNav" class="venueNav"></div>
      <div id="results"><div class="empty">まだ検索していません。</div></div>
      <div id="errors"></div>
    </section>
  </div>
</main>

<div class="bottom">
  <div class="bottomIn">
    <button id="startBtn" class="primary">今日を検索</button>
    <button id="retryBtn" class="secondary hidden">再検索</button>
    <button id="stopBtn" class="stop hidden">途中停止</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const CONTROL_KEY=localStorage.getItem("wt_control_key")||"";
const headers={"Content-Type":"application/json",...(CONTROL_KEY?{"X-Control-Key":CONTROL_KEY}:{})};
let busyAuto=false,lastState=null;

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(ts){if(!ts)return "未検索";return new Date(ts*1000).toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})}
function post(url,body){return fetch(url,{method:"POST",headers,body:body?JSON.stringify(body):null}).then(async r=>{let d={};try{d=await r.json()}catch(e){}return{http:r.status,...d}})}
function phaseName(s){
 if(!s.running){
   if(s.phase==="done")return "検索完了";
   if(s.phase==="stopped")return "途中停止";
   if(s.phase==="error")return "エラー";
   if(s.phase==="select")return "F2取得完了";
   return "待機中";
 }
 return ({queued:"PC応答待ち",board:"開催場取得中",races:"検索中",stopping:"停止中"})[s.phase]||"検索中";
}
function pct(s,c){
 if(s.phase==="done"||s.phase==="select")return 100;
 const total=Number(c.selected_venues||c.board_total||0),done=Number(c.venue_index||c.board_done||0);
 if(total>0)return Math.max(4,Math.min(99,Math.round(done/total*100)));
 return s.running?12:0;
}
function renderF2(rows){
 const f2=(rows||[]).filter(v=>v.grade==="F2");
 $("f2List").innerHTML=f2.length?f2.map(v=>`<span class="f2pill">${esc(v.venue)}<span class="g"> F2</span><span class="s">${esc(v.session||"?")}</span></span>`).join(""):'<span style="color:#71869b;font-size:11px">F2開催なし</span>';
}
function renderMatches(rows){
 $("matchCount").textContent=rows.length;
 if(!rows.length){
   $("venueNav").innerHTML="";
   $("results").innerHTML='<div class="empty">現在の該当レースなし</div>';
   return;
 }
 const counts={};
 rows.forEach(r=>counts[r.venue]=(counts[r.venue]||0)+1);
 $("venueNav").innerHTML=Object.entries(counts).map(([v,n])=>`<a class="venueBtn" href="#v-${encodeURIComponent(v)}">${esc(v)} ${n}件</a>`).join("");
 const seen={};
 $("results").innerHTML=rows.map(r=>{
   const anchor=!seen[r.venue]?(seen[r.venue]=true,` id="v-${encodeURIComponent(r.venue)}"`):"";
   const url=r.event_url||r.winticket_url||r.prediction_url||"#";
   return `<article class="race"${anchor}>
    <div class="raceTop">
      <div><div class="venue">${esc(r.venue)}</div><div class="raceNo">${esc(r.race)}R</div></div>
      <div class="session">${esc(r.session||"")}</div>
    </div>
    <div class="tags">
      <span class="tag">${esc(r.grade||"F2")}</span>
      <span class="tag star">${esc(r.star||"星2")}</span>
      <span class="tag">${esc(r.line||"")}</span>
      <span class="tag hit">${esc(r.three_order||"")}</span>
    </div>
    <div class="order"><b>並び・印</b><br>${esc(r.order||"—")}</div>
    <div class="bet"><small>買い目</small><b>${esc(r.bet||"既存条件")}</b><div class="cond">${esc(r.condition_name||"")}</div></div>
    <a class="vote" href="${esc(url)}" target="_blank" rel="noopener">WINTICKETで投票</a>
   </article>`;
 }).join("");
}
async function update(){
 try{
  const s=await (await fetch("/api/status",{cache:"no-store"})).json();lastState=s;
  const c=s.counters||{},matches=s.matches||[],errors=s.errors||[];
  $("pcState").textContent=s.agent_online?"接続中":"未接続";
  $("updated").textContent=fmt(s.updated_at||s.finished_at||0);
  $("status").textContent=phaseName(s);
  $("current").textContent=s.current||"—";
  $("detail").textContent=s.detail||"";
  $("fill").style.width=pct(s,c)+"%";
  $("checked").textContent=c.checked_races||0;
  $("star").textContent=c.star2||0;
  $("lineCount").textContent=c.line_target||0;
  $("orderCount").textContent=c.order_target||0;
  $("resultHint").textContent=s.phase==="done"?`${matches.length}件`:(s.running?"検索中":"未検索");
  renderF2(s.venues_info||[]);
  renderMatches(matches);
  $("errors").innerHTML=errors.map(e=>`<div class="error">${esc(e)}</div>`).join("");
  $("startBtn").disabled=!!s.running||!s.agent_online;
  $("retryBtn").classList.toggle("hidden",s.running||!s.agent_online||!["done","stopped"].includes(s.phase));
  $("stopBtn").classList.toggle("hidden",!s.running);
 }catch(e){$("pcState").textContent="通信エラー"}
}
async function startAll(){
 if(busyAuto)return;
 busyAuto=true;
 try{
  let d=await post("/api/control/load-board",{});
  if(!d.ok){alert("開催場取得を開始できません: "+(d.reason||d.http));return}
  const deadline=Date.now()+180000;
  while(Date.now()<deadline){
    await new Promise(r=>setTimeout(r,1500));
    const st=await (await fetch("/api/status",{cache:"no-store"})).json();
    if(!st.running && (st.venues_info||[]).length){
      d=await post("/api/control/auto-search",{});
      if(!d.ok)alert("F2自動検索を開始できません: "+(d.reason||d.http));
      return;
    }
    if(st.phase==="error"){alert("開催場取得でエラーが発生しました");return}
  }
  alert("開催場取得がタイムアウトしました");
 }finally{busyAuto=false}
}
$("startBtn").onclick=startAll;
$("retryBtn").onclick=async()=>{const d=await post("/api/control/auto-search",{});if(!d.ok)alert("再検索できません: "+(d.reason||d.http))};
$("stopBtn").onclick=async()=>{await post("/api/control/stop",{})};
setInterval(update,1500);
update();
</script>
</body>
</html>
