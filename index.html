<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SELECT ENGINE</title>
<style>body{font-family:-apple-system;background:#06101d;color:#fff;margin:0;padding:16px 16px 100px}.card{background:#0d1b2e;border:1px solid #294767;border-radius:18px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.v{background:#0a1626;border:1px solid #294767;border-radius:14px;padding:12px;position:relative}.v input{position:absolute;right:10px;top:10px;width:24px;height:24px}.name{font-size:20px;font-weight:900}.tag{display:inline-block;margin:8px 4px 0 0;padding:5px 8px;border:1px solid #42668e;border-radius:8px;font-weight:800}.f2{color:#70eaa1}.f1{color:#ff9fa8}.race{background:#102039;border-radius:14px;padding:12px;margin:8px 0}button{border:0;border-radius:13px;padding:14px;color:#fff;background:#387df6;font-weight:900;font-size:15px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#050c16;padding:10px;display:flex;gap:8px}.bottom button{flex:1}.hide{display:none}.stop{background:#9a3a41}.finish{background:#25415f}a{color:#9ec8ff}</style></head><body>
<h1>今日の開催場</h1><p>1ページでF1/F2と M/D/N/MN を取得 → チェックした場だけ検索</p>
<div class="card"><b>① 開催場を選択</b><div id="board" class="grid"><p>「今日の開催場を取得」を押してください。</p></div><p id="sel">M=モーニング / D=デイ / N=ナイター / MN=ミッドナイト</p></div>
<div class="card"><b id="status">待機中</b><p id="current">現在：—</p><p>確認 <span id="checked">0</span> / 星2 <span id="star">0</span> / 該当 <span id="match">0</span></p></div>
<div class="card"><b>② 該当レース</b><div id="results">まだ検索していません。</div><div id="errors"></div></div>
<div class="bottom"><button id="load">今日の開催場を取得</button><button id="search" class="hide">チェックした場を検索</button><button id="stop" class="stop hide">途中停止</button><button id="finish" class="finish hide">終了</button></div>
<script>
const $=x=>document.getElementById(x),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));let key="";
function selected(){return [...document.querySelectorAll(".ck:checked")].map(x=>x.value)}
function board(a){let k=JSON.stringify(a);if(k===key)return;key=k;$("board").innerHTML=a.map(v=>`<label class="v"><input class="ck" type="checkbox" value="${esc(v.slug)}"><div class="name">${esc(v.venue)}</div><span class="tag ${v.grade==="F2"?"f2":"f1"}">${esc(v.grade)}</span><span class="tag">${esc(v.session)}</span></label>`).join("");document.querySelectorAll(".ck").forEach(x=>x.onchange=()=>{$("sel").textContent=`選択中 ${selected().length}場`})}
function results(a){$("results").innerHTML=a.length?a.map(r=>`<div class="race"><b>${esc(r.venue)} ${esc(r.race)}R</b>　${esc(r.session)}<br>${esc(r.star)} / ${esc(r.line)} / ${esc(r.three_order)}<br><a href="${esc(r.prediction_url)}" target="_blank">WINTICKETで見る</a></div>`).join(""):"現在の該当レースなし"}
async function post(u,b){return (await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):null})).json()}
async function up(){try{let s=await(await fetch("/api/status",{cache:"no-store"})).json(),c=s.counters||{};$("status").textContent=({idle:"待機中",board:"開催場取得中",select:"チェック待ち",races:"検索中",done:"検索完了",stopped:"途中停止",error:"エラー"})[s.phase]||s.phase;$("current").textContent="現在："+(s.current||"—");$("checked").textContent=c.checked_races||0;$("star").textContent=c.star2||0;$("match").textContent=(s.matches||[]).length;if(s.venues_info?.length)board(s.venues_info);results(s.matches||[]);$("errors").innerHTML=(s.errors||[]).map(e=>`<p>${esc(e)}</p>`).join("");$("load").classList.toggle("hide",s.running||s.phase!=="idle");$("search").classList.toggle("hide",s.running||s.phase!=="select");$("stop").classList.toggle("hide",!s.running);$("finish").classList.toggle("hide",s.running||!["select","done","stopped","error"].includes(s.phase))}catch(e){}}
$("load").onclick=()=>post("/api/load-venues").then(up);$("search").onclick=()=>{let a=selected();if(!a.length)return alert("場をチェックしてください");post("/api/search-selected",{selected:a}).then(up)};$("stop").onclick=()=>post("/api/stop").then(up);$("finish").onclick=()=>post("/api/reset").then(()=>{key="";up()});up();setInterval(up,1000)
</script></body></html>
