<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<link rel="manifest" href="/manifest.webmanifest">
<title>今日の該当レース</title>

<style>
:root{
 --bg:#07111f;--card:#101d30;--card2:#0c1727;--line:#263b58;--text:#f7faff;
 --muted:#92a6c0;--blue:#3478f6;--green:#50df89;--orange:#ffb45c;--red:#ff6b76;
 font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#07111f,#091525);color:var(--text)}
main{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px calc(108px + env(safe-area-inset-bottom))}
.hidden{display:none!important}
.top{padding:20px 3px 12px}
.eyebrow{color:#7fa9e8;font-size:12px;font-weight:800;letter-spacing:.04em}
.top h1{font-size:29px;margin:5px 0 5px}
.subtitle{color:var(--muted);font-size:13px;line-height:1.55}

.hero{background:linear-gradient(135deg,#173b6b,#142740);border:1px solid #315a88;border-radius:23px;padding:18px;margin:8px 0 13px;box-shadow:0 10px 32px #0002}
.heroRow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.resultLabel{font-size:12px;color:#b8cae2;font-weight:800;margin-bottom:5px}
.count{font-size:58px;line-height:.95;font-weight:950}
.count small{font-size:16px;color:#c5d3e5;margin-left:5px}
.updated{font-size:11px;color:#a6b7ca;text-align:right}
.updated b{font-size:14px;color:#e6effc}
.conditionTitle{font-size:11px;color:#a9bdd8;margin-top:16px;margin-bottom:7px;font-weight:800}
.condition{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:#0b1a2e;border:1px solid #31517c;padding:7px 9px;border-radius:999px;font-size:12px;font-weight:850}
.chip.star2{background:#2d250d;border-color:#8a7020;color:#ffe178}

.quickStats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0 14px}
.quickStat{background:#0d1a2b;border:1px solid #213852;border-radius:14px;padding:10px;text-align:center}
.quickStat b{display:block;font-size:19px}
.quickStat span{display:block;color:var(--muted);font-size:10px;margin-top:2px}

.statusCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:15px}
.statusRow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.statusLabel{font-weight:900}
.statusText{color:#d4e1f0;font-weight:800}
.phaseText{font-size:12px;color:#8fb6eb;margin-top:8px;line-height:1.45}
.bar{height:9px;background:#08111e;border-radius:999px;overflow:hidden;margin-top:11px}
.fill{height:100%;width:0;background:linear-gradient(90deg,#3478f6,#67a2ff);transition:width .25s}

.sectionTitle{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 9px}
.sectionTitle h2{font-size:19px;margin:0}
.hint{font-size:11px;color:var(--muted)}

.race{background:linear-gradient(180deg,#122038,#101c2f);border:1px solid #335273;border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 8px 28px #0003}
.raceTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.venue{font-size:22px;font-weight:950}
.raceNo{color:#a8c2e5;font-size:14px;margin-top:2px;font-weight:800}
.time{font-size:27px;font-weight:950;text-align:right}
.day{font-size:11px;color:var(--muted);text-align:right}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tag{padding:7px 9px;border-radius:10px;background:#0a1627;border:1px solid #2c4566;font-size:13px;font-weight:850}
.tag.hit{background:#0d3023;border-color:#277d54;color:#70eda7}
.tag.star{background:#2d250d;border-color:#8a7020;color:#ffe178}
.order{margin-top:11px;background:var(--card2);padding:11px;border-radius:13px;color:#d4e0ef;font-size:14px;line-height:1.5}
.open{display:block;text-decoration:none;color:#fff;background:#20395d;padding:12px;border-radius:12px;text-align:center;font-size:13px;font-weight:850;margin-top:10px}

.empty{background:var(--card);border:1px dashed #324863;border-radius:20px;padding:28px 15px;text-align:center;color:var(--muted)}
.empty b{display:block;color:#fff;font-size:18px;margin-bottom:6px}

.pendingBox{margin-top:18px}
.pendingToggle{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;background:#131b29;border:1px solid #403d50;border-radius:16px;padding:13px 14px;color:#fff;font-weight:850;font-size:15px}
.pendingToggle small{color:#c2b7ce;font-size:11px;font-weight:700}
.pendingToggle .arrow{transition:transform .2s}
.pendingToggle.open .arrow{transform:rotate(180deg)}
.pendingList{margin-top:8px}
.unpub{background:#171a24;border:1px solid #4b4255;border-radius:14px;padding:11px 12px;margin:7px 0}
.unpub b{font-size:15px}
.unpub span{display:block;color:#c7b6d7;font-size:12px;margin-top:4px}

.error{color:#ffc0c5;font-size:12px;background:#32161b;border-radius:12px;padding:10px;margin-top:10px}

.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(5,12,22,.94);backdrop-filter:blur(18px);border-top:1px solid #243550;padding:10px 14px calc(10px + env(safe-area-inset-bottom));z-index:20}
.bottomIn{max-width:720px;margin:auto;display:flex;gap:9px}
button{border:0;border-radius:15px;padding:15px;font-size:16px;font-weight:900;color:#fff}
.refresh{flex:1;background:var(--blue)}
.refresh:disabled{opacity:.55}
.spin{display:inline-block;width:13px;height:13px;border:2px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:7px;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

</head>
<body>
<main>
  <div class="top">
    <div class="eyebrow">WINTICKET AUTO FINDER <span style="opacity:.72;font-weight:700">v2.4.4</span></div>
    <h1>今日の該当レース</h1>
    <div class="subtitle">今日開催 → F2 → AI予想 星2 → 指定ライン・印の順で自動判定します。</div>
  </div>

  <section class="hero">
    <div class="heroRow">
      <div>
        <div class="resultLabel">本日の該当</div>
        <span id="count" class="count">—<small>件</small></span>
      </div>
      <div class="updated">最終更新<br><b id="updated">未取得</b></div>
    </div>

    <div class="conditionTitle">検索条件</div>
    <div class="condition">
      <span class="chip">F2</span>
      <span class="chip star2">AI予想 ★★☆ 星2</span>
      <span class="chip">3.2.2</span>
      <span class="chip">2.3.2</span>
      <span class="chip">2.2.3</span>
      <span class="chip">◎○△ / ◎○×</span>
    </div>
  </section>

  <div class="quickStats">
    <div class="quickStat"><b id="checkedStat">—</b><span>確認レース</span></div>
    <div class="quickStat"><b id="pendingStat">—</b><span>未判定</span></div>
    <div class="quickStat"><b id="errorStat">—</b><span>取得エラー</span></div>
  </div>

  <section class="statusCard">
    <div class="statusRow">
      <span class="statusLabel">検索状況</span>
      <span id="status" class="statusText">準備中</span>
    </div>
    <div id="phaseText" class="phaseText">今日の開催状況を確認する準備をしています。</div>
    <div class="statusRow" style="margin-top:8px">
      <span class="hint">現在</span><span id="current" class="hint">—</span>
    </div>
    <div class="bar"><div id="fill" class="fill"></div></div>
    <div id="errorBox"></div>
  </section>

  <div class="sectionTitle">
    <h2>該当レース</h2>
    <span id="checked" class="hint"></span>
  </div>
  <section id="list">
    <div class="empty"><b>検索前です</b>自動検索を開始しています。</div>
  </section>

  <section id="unpublishedSection" class="pendingBox hidden">
    <button id="pendingToggle" class="pendingToggle" type="button" aria-expanded="false">
      <span>まだ判定できないレース <small id="pendingLabel">0件</small></span>
      <span class="arrow">▼</span>
    </button>
    <div id="unpublishedList" class="pendingList hidden"></div>
  </section>
</main>

<div class="bottom">
  <div class="bottomIn">
    <button id="refresh" class="refresh">今日を更新</button>
  </div>
</div>
<script>
let autoRequested=false;
let localScanStartedAt=0;

function fmt(ts){
  if(!ts)return "未取得";
  const d=new Date(ts*1000);
  return d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"});
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]||m))
}
function phaseMessage(s){
  if(!s.running){
    if(s.phase==="done") return "検索が完了しました。上の該当レースだけ確認すればOKです。";
    if(s.phase==="error") return "検索中にエラーが発生しました。下の表示を確認してください。";
    return "「今日を更新」で最新の予想を再確認できます。";
  }
  if(s.phase==="venues") return "① 今日開催している競輪場を確認しています。";
  if(s.phase==="races") return "② F2・AI予想 星2・ライン・印条件を順番に判定しています。";
  return "検索を開始しています。";
}
function renderMatches(rows){
  const list=document.getElementById("list");
  if(!rows || rows.length===0){
    list.innerHTML='<div class="empty"><b>現在の該当レースなし</b>未判定がある場合は、予想公開後に「今日を更新」で再確認します。</div>';
    return;
  }
  list.innerHTML=rows.map(r=>`
    <article class="race">
      <div class="raceTop">
        <div>
          <div class="venue">${esc(r.venue)}</div>
          <div class="raceNo">${esc(r.race)}R</div>
        </div>
        <div>
          <div class="time">${esc(r.time||"時刻未取得")}</div>
          <div class="day">${esc(r.day||"")}</div>
        </div>
      </div>
      <div class="tags">
        <span class="tag star">${esc(r.star||"星2")}</span>
        <span class="tag">${esc(r.line)}</span>
        <span class="tag hit">${esc(r.three_order)}</span>
      </div>
      <div class="order"><b>全体の並び・印</b><br>${esc(r.order||"—")}</div>
      <a class="open" href="${esc(r.prediction_url)}" target="_blank" rel="noopener">WINTICKETでこの予想を見る</a>
    </article>`).join("");
}
function renderUnpublished(rows){
  const section=document.getElementById("unpublishedSection");
  const list=document.getElementById("unpublishedList");
  const label=document.getElementById("pendingLabel");
  const n=(rows||[]).length;
  label.textContent=`${n}件`;

  if(!n){
    section.classList.add("hidden");
    list.classList.add("hidden");
    list.innerHTML="";
    return;
  }
  section.classList.remove("hidden");
  list.innerHTML=rows.map(r=>`
    <div class="unpub">
      <b>${esc(r.venue)} ${esc(r.race)}R</b>
      <span>${esc(r.reason||"AI予想・ライン未公開")}</span>
    </div>`).join("");
}
document.getElementById("pendingToggle").addEventListener("click",()=>{
  const btn=document.getElementById("pendingToggle");
  const list=document.getElementById("unpublishedList");
  const open=list.classList.contains("hidden");
  list.classList.toggle("hidden",!open);
  btn.classList.toggle("open",open);
  btn.setAttribute("aria-expanded",open?"true":"false");
});

async function status(){
  try{
    const r=await fetch("/api/status",{cache:"no-store"});
    const s=await r.json();

    const matches=s.matches||[];
    const unpublished=s.unpublished||[];
    const errors=s.errors||[];

    document.getElementById("count").innerHTML=(s.last_update?matches.length:"—")+'<small>件</small>';
    document.getElementById("updated").textContent=fmt(s.last_update);
    document.getElementById("current").textContent=s.current||"—";
    document.getElementById("checked").textContent=s.checked_races?`確認 ${s.checked_races}レース`:"";
    document.getElementById("checkedStat").textContent=s.last_update?(s.checked_races||0):"—";
    document.getElementById("pendingStat").textContent=s.last_update?unpublished.length:"—";
    document.getElementById("errorStat").textContent=s.last_update?errors.length:"—";

    const pct=s.total?Math.max(0,Math.min(100,Math.floor((s.done||0)/s.total*100))):0;
    document.getElementById("fill").style.width=(s.running?Math.max(4,pct):s.phase==="done"?100:pct)+"%";

    const btn=document.getElementById("refresh");
    btn.disabled=!!s.running;
    btn.innerHTML=s.running?'<span class="spin"></span>検索中…':'今日を更新';

    let st="待機中";
    if(s.running) st=s.phase==="venues"?"開催場を確認中":s.phase==="races"?"条件を判定中":"検索準備中";
    else if(s.phase==="done") st="検索完了";
    else if(s.phase==="error") st="エラー";
    document.getElementById("status").textContent=st;
    document.getElementById("phaseText").textContent=phaseMessage(s);

    if(!s.running && s.last_update){
      renderMatches(matches);
      renderUnpublished(unpublished);
    }

    const eb=document.getElementById("errorBox");
    if(s.phase==="error"){
      eb.innerHTML=`<div class="error">${esc(s.message||"検索エラー")}</div>`;
    }else if(errors.length){
      eb.innerHTML=`<div class="error">一部取得できないページあり：${errors.length}件</div>`;
    }else{
      eb.innerHTML="";
    }

    if(!autoRequested && !s.running && !s.last_update){
      autoRequested=true;
      localScanStartedAt=Date.now();
      await fetch("/api/auto",{method:"POST"});
    }
  }catch(e){
    document.getElementById("status").textContent="サーバー未接続";
    document.getElementById("phaseText").textContent="Renderサーバーへの接続を確認しています。";
    document.getElementById("errorBox").innerHTML='<div class="error">検索サーバーに接続できません。</div>';
  }
}

document.getElementById("refresh").addEventListener("click",async()=>{
  localScanStartedAt=Date.now();
  await fetch("/api/search",{method:"POST"});
  status();
});

if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
status();
setInterval(status,1800);
</script>
</body></html>
